name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: remember-me-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package browser extensions
        run: |
          mkdir -p dist
          (cd browser-extension/chrome && zip -r ../../dist/remember-me-chrome-extension.zip .)
          (cd browser-extension/firefox && zip -r ../../dist/remember-me-firefox-extension.zip .)
      - name: Show what will be published
        run: find dist -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          # upload-artifact keeps sub-folders (nsis/, deb/, ...), so search recursively
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/*.zip
          generate_release_notes: true

      # Publish whatever exists, but turn the run red if something is missing.
      - name: Check that every expected file was built
        run: |
          missing=0
          for p in "*.exe" "*.msi" "*.deb" "*.rpm" "*.AppImage" "remember-me-chrome-extension.zip" "remember-me-firefox-extension.zip"; do
            if [ -z "$(find dist -name "$p" -print -quit)" ]; then echo "MISSING: $p"; missing=1; fi
          done
          exit $missing
